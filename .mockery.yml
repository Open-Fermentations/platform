all: false
dir: 'internal/testing/mocks/{{.SrcPackageName}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 4
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: 'mock{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  open-fermentations/internal/devices:
    config:
      dir: "internal/testing/mocks/{{.SrcPackageName}}"
      all: true
      filename: "{{.InterfaceName}}_mock.go"
